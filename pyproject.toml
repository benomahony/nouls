[project]
name = "nouls"
version = "0.1.5"
description = "Semantic linter and language server that asks TypeSafe yes/no questions about every function"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Ben O'Mahony", email = "bomarni@gmail.com"}
]
license = {text = "MIT"}

dependencies = [
    "cyclopts>=4.25.2",
    "lsprotocol>=2025.0.0",
    "pydantic>=2.13.5",
    "pygls>=2.1.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tree-sitter>=0.25.2,<0.26",  # 0.26.0 Point refcount bug: py-tree-sitter#472, fixed by #466
    "tree-sitter-language-pack>=1.20.0",
    "typesafe-sdk>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "pytest-examples>=0.0.10",
    "pytest-xdist>=3.0.0",
    "pytest-testmon>=2.0.0",
    "ruff>=0.3.0",
    "basedpyright>=1.10.0",
    "prek>=0.1.0",
    "vulture>=2.11",
    "bandit>=1.7.0",
    "deptry>=0.12.0",
    "cliqa>=0.1.0",
    "bump-my-version>=0.28.0",
    "zensical>=0.0.10",
]
mcp = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
nouls = "nouls.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nouls"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
select = ["ALL"]
# Only rules that contradict another rule or tool enforced here are ignored.
ignore = [
    "assert",                             # nasa-lsp requires two asserts per function; pytest asserts
    "missing-trailing-comma",             # conflicts with ruff format, per ruff's formatter docs
    "incorrect-blank-line-before-class",  # contradicts D211, which is enforced instead
    "multi-line-summary-second-line",     # contradicts D212, which is enforced instead
]

[tool.ruff.lint.per-file-ignores]
# These tests exist to run nouls as a real process, with fixed arguments.
"tests/test_integration.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)Copyright \\d{4} Ben O'Mahony"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=nouls",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]
usefixtures = ["isolated"]
markers = [
    "unit: Fast unit tests (no subprocess, can run in parallel with -n auto)",
    "integration: Slow integration tests (subprocess, run sequentially)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.basedpyright]
include = ["src/nouls", "tests"]
typeCheckingMode = "all"
# ruff's ISC003 requires implicit concatenation, so the opposite check is off.
reportImplicitStringConcatenation = false

[tool.deptry]
extend_exclude = ["tests"]
known_first_party = ["nouls"]
pep621_dev_dependency_groups = ["dev"]

[tool.bumpversion]
current_version = "0.1.5"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/nouls/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[dependency-groups]
dev = [
    "nasa-lsp>=0.1.14",
]
