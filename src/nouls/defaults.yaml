model: jev-1.12
threshold: 0.8
concurrency: 8
debounce_ms: 1000
show_probability: true
lint_on: change

exclude: [".*", node_modules, __pycache__, target, dist, build, venv]

languages:
  python:
    grammar: python
    extensions: [.py]
    units: [function_definition]
  javascript:
    grammar: javascript
    extensions: [.js, .jsx, .mjs, .cjs]
    units: [function_declaration, method_definition]
  typescript:
    grammar: typescript
    extensions: [.ts, .mts, .cts]
    units: [function_declaration, method_definition]
  tsx:
    grammar: tsx
    extensions: [.tsx]
    units: [function_declaration, method_definition]
  go:
    grammar: go
    extensions: [.go]
    units: [function_declaration, method_declaration]
  rust:
    grammar: rust
    extensions: [.rs]
    units: [function_item]
  java:
    grammar: java
    extensions: [.java]
    units: [method_declaration, constructor_declaration]
  c:
    grammar: c
    extensions: [.c, .h]
    units: [function_definition]
  cpp:
    grammar: cpp
    extensions: [.cpp, .cc, .cxx, .hpp]
    units: [function_definition]
  lua:
    grammar: lua
    extensions: [.lua]
    units: [function_declaration]
  ruby:
    grammar: ruby
    extensions: [.rb]
    units: [method, singleton_method]

rules:
  name_behaviour_mismatch:
    question: Does the function's name describe something materially different from what its body actually does?
    message: Function name does not match what the function does
    severity: warning
  docstring_drift:
    question: Does the function's docstring or any comment inside it describe behaviour that the code does not implement?
    message: Docstring or comment has drifted from the implementation
    severity: warning
  query_with_side_effect:
    question: Is the function named like a query or predicate, such as get, is, has or find, while it also modifies state, writes to storage or sends messages?
    message: Query style function has side effects
    severity: warning
  partial_failure:
    question: Does the function perform several writes or external calls in sequence so that a failure partway through would leave data inconsistent, with no transaction, rollback or compensation?
    message: A failure partway through leaves inconsistent state
    severity: warning
  check_then_act:
    question: Does the function check a condition on shared or external state and then act on it, where that state could change between the check and the action?
    message: Check then act on state that can change in between
    severity: warning
  non_idempotent_retry:
    question: Does the function retry an operation that is not idempotent, so that a retry could apply its effect twice?
    message: Retrying an operation that is not idempotent
    severity: error
  unit_mismatch:
    question: Does the function combine or compare quantities in different units, such as seconds and milliseconds or pence and pounds, without converting between them?
    message: Quantities in different units are mixed without conversion
    severity: error
  boundary_error:
    question: Does the function's boundary logic contradict its evident intent, such as an off by one range, an inclusive check that should be exclusive, or a comparison in the wrong direction?
    message: Boundary logic contradicts the evident intent
    severity: error
  missing_authorisation:
    question: Does the function perform a privileged or user specific action on behalf of a caller without checking that the caller is allowed to perform it?
    message: Privileged action without an authorisation check
    severity: warning
  misleading_error:
    question: Does the function raise or log an error message that misdescribes the failure that actually occurred?
    message: Error message misdescribes the actual failure
    severity: info
  mixed_abstraction:
    question: Does the function mix high level business steps with low level mechanical detail, such as parsing, raw SQL or byte handling, in the same body?
    message: Function mixes levels of abstraction
    severity: info
  test_not_isolated:
    question: Is this a test whose result could change depending on which other tests ran before it, for example because it reads or mutates module level, class level, database or filesystem state that other tests also touch without resetting it?
    message: Test is not isolated from other tests
    severity: warning
    files: &test_files
      - test_*.py
      - "*_test.py"
      - "*_test.go"
      - "*.test.[jt]s"
      - "*.test.[jt]sx"
      - "*.spec.[jt]s"
      - "*.spec.[jt]sx"
      - "*Test.java"
      - "*Tests.java"
      - "*_spec.rb"
      - "*_test.rb"
      - "*_spec.lua"
      - "*_test.lua"
      - "*/tests/*.rs"
      - "*_test.c"
      - "*_test.cpp"
  test_not_composable:
    question: Is this a test that varies several independent dimensions of behaviour at once, so they cannot be checked separately and combined, for example one test covering every combination of inputs, formats and error modes?
    message: Test couples independent dimensions of variability
    severity: info
    files: *test_files
  test_nondeterministic:
    question: Is this a test whose result could change between runs with no code change, because it depends on the current time, unseeded randomness, real network calls, sleeps or timing, thread scheduling or unordered iteration?
    message: Test result is not deterministic
    severity: error
    files: *test_files
  test_slow:
    question: Is this a test that would run slowly, because it sleeps, waits on timeouts, calls real external services or databases, or loops over far more data than the behaviour needs?
    message: Test is likely to be slow
    severity: warning
    files: *test_files
  test_hard_to_write:
    question: Is this a test whose setup is large or elaborate relative to the behaviour it checks, such as many mocks, long object construction or copied fixtures, suggesting the code under test is expensive to test?
    message: Test is expensive to write relative to what it checks
    severity: info
    files: *test_files
  test_unreadable:
    question: Is this a test where a reader could not tell from its name and body what behaviour it checks and why, for example a vague name, unexplained magic values or no clear arrange, act and assert steps?
    message: Test does not make its motivation clear
    severity: info
    files: *test_files
  test_not_behavioural:
    question: Is this a test that would still pass if the behaviour it claims to check were broken, for example because it asserts nothing, asserts only that no exception was raised, or asserts on values it set up itself?
    message: Test is not sensitive to the behaviour it names
    severity: error
    files: *test_files
  test_structure_sensitive:
    question: Is this a test that would fail after a refactoring that keeps behaviour the same, because it asserts on private attributes, internal call order, mock call counts of internal collaborators or other implementation details?
    message: Test is coupled to implementation structure
    severity: warning
    files: *test_files
  test_not_automated:
    question: Is this a test that needs human intervention, for example reading input, printing output for someone to inspect instead of asserting, opening a browser or depending on manual setup steps?
    message: Test needs human intervention
    severity: error
    files: *test_files
  test_not_specific:
    question: Is this a test where a failure would not point to an obvious cause, because it checks several unrelated behaviours in one test or asserts on a large opaque value without saying what matters?
    message: A failure in this test would not point to a clear cause
    severity: warning
    files: *test_files
  test_not_predictive:
    question: Is this a test that could pass while the real code would fail in production, because it mocks or stubs out the very behaviour it claims to test or replaces it with a simplified fake?
    message: Test passing does not predict production behaviour
    severity: warning
    files: *test_files
  test_not_inspiring:
    question: Is this a test that would give a reader little confidence the code works even when it passes, because it checks something trivial or incidental, exercises the framework or language rather than the code under test, covers only the easy path of risky behaviour, or claims in its name more than it actually verifies?
    message: Passing this test would not inspire confidence
    severity: warning
    files: *test_files
